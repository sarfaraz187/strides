[project]
name = "strides"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.117.0",
    "cachetools>=7.1.7",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langfuse>=4.14.3",
    "mcp[cli]>=1.28.1",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.13.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "responses>=0.26.2",
    "ruff>=0.16.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
