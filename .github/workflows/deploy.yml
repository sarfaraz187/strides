name: Deploy to Cloud Run

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "mcp_servers/fit_server/**"
      - "mcp_servers/calendar_server/**"
      - "data/**"
      - "auth/**"
      - "pyproject.toml"
      - "uv.lock"

env:
  PROJECT_ID: strides-503723
  REGION: us-central1
  REPO: us-central1-docker.pkg.dev/strides-503723/strides

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/991288124020/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "strides-deployer@strides-503723.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - run: |
          docker build -f backend/Dockerfile -t ${{ env.REPO }}/backend:${{ github.sha }} .
          docker push ${{ env.REPO }}/backend:${{ github.sha }}

      - run: |
          ENV_VARS="DATABASE_URL=${{ secrets.DATABASE_URL }}"
          ENV_VARS="$ENV_VARS,ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
          ENV_VARS="$ENV_VARS,TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}"
          ENV_VARS="$ENV_VARS,GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          ENV_VARS="$ENV_VARS,SUPABASE_STORAGE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_STORAGE_SERVICE_ROLE_KEY }}"
          ENV_VARS="$ENV_VARS,LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}"
          ENV_VARS="$ENV_VARS,LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}"
          ENV_VARS="$ENV_VARS,PRIVATE_KEY_B64=${{ secrets.PRIVATE_KEY_B64 }}"
          ENV_VARS="$ENV_VARS,PUBLIC_KEY_B64=${{ secrets.PUBLIC_KEY_B64 }}"
          ENV_VARS="$ENV_VARS,UNRESTRICTED_EMAILS=${{ secrets.UNRESTRICTED_EMAILS }}"
          ENV_VARS="$ENV_VARS,OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}"
          ENV_VARS="$ENV_VARS,GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}"
          ENV_VARS="$ENV_VARS,FRONTEND_URL=${{ vars.FRONTEND_URL }}"
          ENV_VARS="$ENV_VARS,MCP_SERVER_URL=${{ vars.MCP_SERVER_URL }}"
          ENV_VARS="$ENV_VARS,CALENDAR_MCP_SERVER_URL=${{ vars.CALENDAR_MCP_SERVER_URL }}"
          ENV_VARS="$ENV_VARS,SUPABASE_STORAGE_URL=${{ vars.SUPABASE_STORAGE_URL }}"
          ENV_VARS="$ENV_VARS,LANGFUSE_BASE_URL=${{ vars.LANGFUSE_BASE_URL }}"
          ENV_VARS="$ENV_VARS,OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}"
          ENV_VARS="$ENV_VARS,LANGFUSE_TRACING_ENVIRONMENT=production"
          ENV_VARS="$ENV_VARS,TOKEN_BUDGET_LIMIT=50000"
          ENV_VARS="$ENV_VARS,GOOGLE_LOGIN_CALLBACK_URL=https://backend-991288124020.us-central1.run.app/auth/callback"
          ENV_VARS="$ENV_VARS,GOOGLE_HEALTH_CALLBACK_URL=https://backend-991288124020.us-central1.run.app/auth/health/callback"
          ENV_VARS="$ENV_VARS,GOOGLE_CALENDAR_CALLBACK_URL=https://backend-991288124020.us-central1.run.app/auth/calendar/callback"

          gcloud run deploy backend \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REPO }}/backend:${{ github.sha }} \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=3 \
            --set-env-vars="$ENV_VARS"

  deploy-mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/991288124020/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "strides-deployer@strides-503723.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - run: |
          docker build -f mcp_servers/fit_server/Dockerfile -t ${{ env.REPO }}/mcp-server:${{ github.sha }} .
          docker push ${{ env.REPO }}/mcp-server:${{ github.sha }}

      - run: |
          ENV_VARS="DATABASE_URL=${{ secrets.DATABASE_URL }}"
          ENV_VARS="$ENV_VARS,TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}"
          ENV_VARS="$ENV_VARS,GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          ENV_VARS="$ENV_VARS,OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}"
          ENV_VARS="$ENV_VARS,GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}"
          ENV_VARS="$ENV_VARS,STRIDES_JWKS_URL=${{ vars.STRIDES_JWKS_URL }}"
          ENV_VARS="$ENV_VARS,OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}"

          gcloud run deploy mcp-server \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REPO }}/mcp-server:${{ github.sha }} \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=3 \
            --set-env-vars="$ENV_VARS"

  deploy-calendar-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/991288124020/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "strides-deployer@strides-503723.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - run: |
          docker build -f mcp_servers/calendar_server/Dockerfile -t ${{ env.REPO }}/calendar-server:${{ github.sha }} .
          docker push ${{ env.REPO }}/calendar-server:${{ github.sha }}

      - run: |
          ENV_VARS="DATABASE_URL=${{ secrets.DATABASE_URL }}"
          ENV_VARS="$ENV_VARS,TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}"
          ENV_VARS="$ENV_VARS,GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
          ENV_VARS="$ENV_VARS,OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}"
          ENV_VARS="$ENV_VARS,GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}"
          ENV_VARS="$ENV_VARS,STRIDES_JWKS_URL=${{ vars.STRIDES_JWKS_URL }}"
          ENV_VARS="$ENV_VARS,OTEL_EXPORTER_OTLP_ENDPOINT=${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}"

          gcloud run deploy calendar-server \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --image=${{ env.REPO }}/calendar-server:${{ github.sha }} \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=3 \
            --set-env-vars="$ENV_VARS"
